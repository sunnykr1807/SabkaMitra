<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Crop Tool - SabkaMitra</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"/>

<link rel="stylesheet" href="image-crop.css">

</head>

<body>

<div class="container py-5">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-primary text-white">

<h2 class="text-center mb-0">

✂️ Image Crop Tool

</h2>

</div>

<div class="card-body">

<div class="mb-4">

<label class="form-label fw-bold">

Choose Image

</label>

<input
type="file"
id="imageInput"
class="form-control"
accept="image/*">

</div>

<div class="row">

<div class="col-lg-8">

<div class="image-box">

<img id="image">

</div>

</div>

<div class="col-lg-4">

<h5 class="text-center mb-3">

Live Preview

</h5>

<div class="preview"></div>

<hr>

<div class="d-grid gap-2">

<button id="zoomIn" class="btn btn-primary">

Zoom +

</button>

<button id="zoomOut" class="btn btn-primary">

Zoom -

</button>

<button id="rotateLeft" class="btn btn-warning">

Rotate Left

</button>

<button id="rotateRight" class="btn btn-warning">

Rotate Right

</button>

<button id="reset" class="btn btn-secondary">

Reset

</button>

<button id="cropBtn" class="btn btn-success">

Crop Image

</button>

<button id="downloadBtn" class="btn btn-danger">

Download

</button>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script src="image-crop.js"></script>

</body>
</html>
