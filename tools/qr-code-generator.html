
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator | SabkaMitra</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f5f7fb;
    color: #202938;
    font-family: Arial, sans-serif;
}

.navbar {
    background: white;
    border-bottom: 1px solid #e8ebf1;
    padding: 17px 0;
}

.brand {
    font-size: 23px;
    font-weight: 700;
    color: #202938;
    text-decoration: none;
}

.brand span { color: #2563eb; }

.main {
    max-width: 1050px;
    margin: 55px auto;
    padding: 0 18px;
}

.heading { text-align: center; margin-bottom: 35px; }

.heading h1 {
    font-size: 36px;
    font-weight: 750;
}

.heading p { color: #64748b; }

.tool-box {
    background: white;
    border: 1px solid #e7eaf0;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,.04);
}

.form-label { font-weight: 600; }

.form-control, .form-select {
    padding: 12px;
    border-radius: 9px;
}

.form-control:focus, .form-select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

.btn-generate {
    background: #2563eb;
    color: white;
    padding: 13px 25px;
    border-radius: 9px;
    font-weight: 600;
    border: none;
}

.btn-generate:hover {
    background: #1d4ed8;
    color: white;
}

.qr-result {
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 15px;
    min-height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    flex-direction: column;
}

#qrcode {
    background: white;
    padding: 12px;
    border-radius: 8px;
    min-height: 0;
}

#qrcode img, #qrcode canvas {
    max-width: 100%;
    height: auto !important;
}

#downloadBtn { display: none; }

.footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

@media(max-width: 600px) {
    .heading h1 { font-size: 28px; }
    .tool-box { padding: 18px; }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a href="../index.html" class="brand">
            <i class="bi bi-grid-fill"></i>
            Sabka<span>Mitra</span>
        </a>
        <a href="../index.html" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-house"></i> Home
        </a>
    </div>
</nav>

<main class="main">

    <div class="heading">
        <h1><i class="bi bi-qr-code text-primary"></i> QR Code Generator</h1>
        <p>Create and download your own QR code instantly.</p>
    </div>

    <div class="tool-box">
        <div class="row g-4">

            <div class="col-lg-6">

                <label class="form-label">Enter Text or Website URL</label>

                <textarea id="qrText" class="form-control mb-3"
                rows="5" placeholder="https://example.com"></textarea>

                <label class="form-label">QR Code Size</label>

                <select id="qrSize" class="form-select mb-3">
                    <option value="200">200 × 200</option>
                    <option value="300" selected>300 × 300</option>
                    <option value="400">400 × 400</option>
                    <option value="500">500 × 500</option>
                </select>

                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">QR Color</label>
                        <input type="color" id="darkColor"
                        class="form-control form-control-color w-100"
                        value="#000000">
                    </div>

                    <div class="col-6">
                        <label class="form-label">Background</label>
                        <input type="color" id="lightColor"
                        class="form-control form-control-color w-100"
                        value="#ffffff">
                    </div>
                </div>

                <button class="btn-generate w-100" id="generateBtn">
                    <i class="bi bi-magic"></i> Generate QR Code
                </button>

                <div id="message" class="small mt-3 text-danger"></div>

            </div>

            <div class="col-lg-6">

                <h5 class="fw-bold mb-3">Your QR Code</h5>

                <div class="qr-result">
                    <div id="placeholder" class="text-center text-secondary">
                        <i class="bi bi-qr-code display-1"></i>
                        <p class="mt-2 mb-0">Your QR code will appear here</p>
                    </div>

                    <div id="qrcode"></div>
                </div>

                <button id="downloadBtn"
                class="btn btn-success w-100 mt-3">
                    <i class="bi bi-download"></i> Download QR Code
                </button>

            </div>

        </div>
    </div>

</main>

<div class="footer">
    Made with ❤️ by SabkaMitra
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const qrText = document.getElementById("qrText");
const qrSize = document.getElementById("qrSize");
const darkColor = document.getElementById("darkColor");
const lightColor = document.getElementById("lightColor");
const qrContainer = document.getElementById("qrcode");
const placeholder = document.getElementById("placeholder");
const downloadBtn = document.getElementById("downloadBtn");
const message = document.getElementById("message");

let currentQR = null;

document.getElementById("generateBtn").addEventListener("click", function () {

    const text = qrText.value.trim();

    message.textContent = "";

    if (!text) {
        message.textContent = "Please enter some text or a URL.";
        qrText.focus();
        return;
    }

    if (typeof QRCode === "undefined") {
        message.textContent = "QR library could not load. Check your internet connection.";
        return;
    }

    qrContainer.innerHTML = "";

    const size = Number(qrSize.value);

    currentQR = new QRCode(qrContainer, {
        text: text,
        width: size,
        height: size,
        colorDark: darkColor.value,
        colorLight: lightColor.value,
        correctLevel: QRCode.CorrectLevel.H
    });

    placeholder.style.display = "none";
    downloadBtn.style.display = "block";

});

downloadBtn.addEventListener("click", function () {

    const canvas = qrContainer.querySelector("canvas");

    if (!canvas) {
        message.textContent = "Please generate a QR code first.";
        return;
    }

    const link = document.createElement("a");

    link.download = "SabkaMitra-QR-Code.png";
    link.href = canvas.toDataURL("image/png");
    link.click();

});
</script>

</body>
</html>
