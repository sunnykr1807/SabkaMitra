
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Background Remover | SabkaMitra</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f5f7fb;
    font-family:Arial,sans-serif;
    color:#172033;
}
.navbar{
    background:white;
    padding:17px 0;
    border-bottom:1px solid #e8eaf0;
}
.brand{font-size:23px;font-weight:800;color:#176bdb}
.brand span{color:#18a879}
.main{max-width:900px;margin:55px auto;padding:0 18px}
.heading{text-align:center;margin-bottom:30px}
.heading h1{font-weight:800;font-size:35px}
.heading p{color:#727b8c}
.panel{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 35px #1b31500d;
}
.upload{
    border:2px dashed #b9c8df;
    border-radius:16px;
    padding:45px 15px;
    text-align:center;
    cursor:pointer;
    background:#f9fbff;
    transition:.2s;
}
.upload:hover{border-color:#176bdb;background:#f1f6ff}
.upload i{font-size:48px;color:#176bdb}
.upload h5{font-weight:700;margin-top:12px}
.preview{
    display:none;
    margin-top:25px;
    text-align:center;
}
.preview img{
    max-width:100%;
    max-height:350px;
    object-fit:contain;
    border-radius:12px;
}
.preview-area{
    background-color:#eee;
    background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),
    linear-gradient(-45deg,#ddd 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ddd 75%),
    linear-gradient(-45deg,transparent 75%,#ddd 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0;
    border-radius:12px;
    padding:15px;
}
.btn-main{
    background:#176bdb;color:white;border:0;
    padding:13px 25px;border-radius:10px;font-weight:700;
}
.btn-main:hover{background:#1056b5;color:white}
.btn-download{
    background:#12a875;color:white;border:0;
    padding:13px 25px;border-radius:10px;
    font-weight:700;text-decoration:none;display:none;
}
.btn-download:hover{background:#0d875e;color:white}
#status{font-size:14px;color:#687386;margin-top:15px}
.progress{height:9px;display:none;margin-top:15px}
footer{text-align:center;color:#8791a2;padding:30px}
@media(max-width:576px){
    .main{margin:30px auto}
    .panel{padding:18px}
    .heading h1{font-size:28px}
}
</style>
</head>

<body>

<nav class="navbar">
<div class="container">
<a href="../index.html" class="text-decoration-none brand">
<i class="bi bi-stars"></i> Sabka<span>Mitra</span>
</a>
</div>
</nav>

<main class="main">

<div class="heading">
<h1>Image Background Remover</h1>
<p>Remove image background automatically with AI.</p>
</div>

<div class="panel">

<label class="upload w-100" for="imageInput" id="uploadBox">
<i class="bi bi-cloud-arrow-up"></i>
<h5>Upload Your Image</h5>
<p class="text-secondary mb-2">Click here or drag and drop your image</p>
<small class="text-secondary">PNG, JPG, JPEG, WEBP</small>
</label>

<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden>

<div class="preview" id="previewBox">
<div class="row g-3">
<div class="col-md-6">
<h6 class="fw-bold mb-3">Original Image</h6>
<div class="preview-area">
<img id="originalImage" alt="Original image">
</div>
</div>

<div class="col-md-6">
<h6 class="fw-bold mb-3">Background Removed</h6>
<div class="preview-area">
<img id="resultImage" alt="Processed image">
</div>
</div>
</div>

<div class="progress" id="progressBox">
<div class="progress-bar progress-bar-striped progress-bar-animated"
id="progressBar" style="width:0%"></div>
</div>

<p id="status">Your image is ready.</p>

<div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
<button class="btn-main" id="removeBtn">
<i class="bi bi-magic"></i> Remove Background
</button>

<a class="btn-download" id="downloadBtn" download="SabkaMitra-Background-Removed.png">
<i class="bi bi-download"></i> Download PNG
</a>
</div>

<button class="btn btn-outline-secondary mt-3" id="resetBtn">
<i class="bi bi-arrow-repeat"></i> Upload Another Image
</button>
</div>

</div>

<p class="text-center text-secondary small mt-4">
<i class="bi bi-shield-check"></i>
Your image is processed in your browser and is not uploaded to our server.
</p>

</main>

<footer>
© 2026 SabkaMitra. All rights reserved.
</footer>


<script>
const input = document.getElementById("imageInput");
const uploadBox = document.getElementById("uploadBox");
const previewBox = document.getElementById("previewBox");
const originalImage = document.getElementById("originalImage");
const resultImage = document.getElementById("resultImage");
const removeBtn = document.getElementById("removeBtn");
const downloadBtn = document.getElementById("downloadBtn");
const resetBtn = document.getElementById("resetBtn");
const statusText = document.getElementById("status");
const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");

let selectedFile = null;
let originalURL = null;
let resultURL = null;

function clearURLs() {
    if (originalURL) URL.revokeObjectURL(originalURL);
    if (resultURL) URL.revokeObjectURL(resultURL);
    originalURL = null;
    resultURL = null;
}

function loadImage(file) {
    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("Please select a valid image.");
        return;
    }

    if (file.size > 15 * 1024 * 1024) {
        alert("Image must be smaller than 15 MB.");
        return;
    }

    clearURLs();
    selectedFile = file;
    originalURL = URL.createObjectURL(file);

    originalImage.src = originalURL;
    resultImage.removeAttribute("src");

    uploadBox.style.display = "none";
    previewBox.style.display = "block";
    downloadBtn.style.display = "none";
    removeBtn.style.display = "inline-block";
    removeBtn.disabled = false;

    statusText.textContent = "Image uploaded successfully!";
}

input.addEventListener("change", function () {
    loadImage(this.files[0]);
});

uploadBox.addEventListener("dragover", function(e) {
    e.preventDefault();
});

uploadBox.addEventListener("drop", function(e) {
    e.preventDefault();
    loadImage(e.dataTransfer.files[0]);
});

removeBtn.addEventListener("click", async function() {
    if (!selectedFile) return;

    removeBtn.disabled = true;
    statusText.textContent = "Loading AI model...";
    progressBox.style.display = "block";

    try {
      const imgly = await import(
    "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm"
);

const removeBackground =
    imgly.removeBackground || imgly.default;

        const blob = await removeBackground(selectedFile, {
            model: "small",
            output: { format: "image/png" }
        });

        resultURL = URL.createObjectURL(blob);
        resultImage.src = resultURL;

        progressBar.style.width = "100%";
        statusText.textContent = "Background removed successfully!";

        downloadBtn.href = resultURL;
        downloadBtn.style.display = "inline-block";
        removeBtn.style.display = "none";

    } catch (error) {
        console.error(error);
        statusText.textContent = "AI processing failed. Check your internet and try again.";
        removeBtn.disabled = false;
    }
});

resetBtn.addEventListener("click", function() {
    clearURLs();
    selectedFile = null;
    input.value = "";
    previewBox.style.display = "none";
    uploadBox.style.display = "block";
    removeBtn.style.display = "inline-block";
    removeBtn.disabled = false;
    removeBtn.innerHTML = '<i class="bi bi-magic"></i> Remove Background';
    progressBox.style.display = "none";
});
</script>


</body>
</html>
