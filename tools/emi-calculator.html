
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Calculator | SabkaMitra</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f5f7fb;
    color: #202938;
    font-family: Arial, sans-serif;
}

.navbar {
    background: white;
    border-bottom: 1px solid #e8ebf1;
    padding: 17px 0;
}

.brand {
    font-size: 23px;
    font-weight: 700;
    color: #202938;
    text-decoration: none;
}

.brand span { color: #2563eb; }

.main {
    max-width: 1050px;
    margin: 50px auto;
    padding: 0 18px;
}

.heading {
    text-align: center;
    margin-bottom: 35px;
}

.heading h1 {
    font-size: 36px;
    font-weight: 750;
}

.heading p { color: #64748b; }

.calculator {
    background: white;
    border: 1px solid #e7eaf0;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,.04);
}

.form-label { font-weight: 600; }

.form-control {
    padding: 12px;
    border-radius: 9px;
}

.form-control:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

.btn-calculate {
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 9px;
    font-weight: 600;
}

.btn-calculate:hover {
    background: #1d4ed8;
    color: white;
}

.result {
    background: #eff6ff;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
}

.emi-value {
    font-size: 38px;
    font-weight: 800;
    color: #2563eb;
}

.result-card {
    background: #f8fafc;
    padding: 18px 12px;
    border: 1px solid #e8edf5;
    border-radius: 12px;
    text-align: center;
    height: 100%;
}

.result-card p {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 5px;
}

.result-card h4 {
    font-weight: 750;
    font-size: 20px;
    margin: 0;
}

.error {
    color: #dc2626;
    font-size: 14px;
}

.footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

@media(max-width:600px) {
    .heading h1 { font-size: 28px; }
    .calculator { padding: 19px; }
    .emi-value { font-size: 30px; }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a href="../index.html" class="brand">
            <i class="bi bi-grid-fill"></i>
            Sabka<span>Mitra</span>
        </a>

        <a href="../index.html" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-house"></i> Home
        </a>
    </div>
</nav>

<main class="main">

    <div class="heading">
        <h1><i class="bi bi-calculator text-primary"></i> EMI Calculator</h1>
        <p>Calculate your monthly loan EMI, interest and total payment.</p>
    </div>

    <div class="calculator">

        <div class="row g-4">

            <div class="col-lg-6">

                <label class="form-label">Loan Amount (₹)</label>
                <input type="number" id="loanAmount"
                class="form-control mb-3"
                placeholder="Example: 500000" min="1">

                <label class="form-label">Annual Interest Rate (%)</label>
                <input type="number" id="interestRate"
                class="form-control mb-3"
                placeholder="Example: 8.5" min="0" step="any">

                <label class="form-label">Loan Duration (Years)</label>
                <input type="number" id="loanYears"
                class="form-control mb-3"
                placeholder="Example: 5" min="0" step="any">

                <label class="form-label">Additional Months</label>
                <input type="number" id="loanMonths"
                class="form-control mb-3"
                placeholder="Example: 6" min="0" max="11">

                <button class="btn-calculate w-100" id="calculateBtn">
                    <i class="bi bi-calculator"></i> Calculate EMI
                </button>

                <button class="btn btn-outline-secondary w-100 mt-2"
                id="resetBtn">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>

                <p id="error" class="error mt-3 mb-0"></p>

            </div>

            <div class="col-lg-6">

                <div class="result h-100 d-flex flex-column justify-content-center">

                    <p class="fw-semibold mb-1">Your Monthly EMI</p>

                    <div class="emi-value" id="emi">₹0</div>

                    <div class="row g-3 mt-3">

                        <div class="col-6">
                            <div class="result-card">
                                <p>Loan Amount</p>
                                <h4 id="principal">₹0</h4>
                            </div>
                        </div>

                        <div class="col-6">
                            <div class="result-card">
                                <p>Total Interest</p>
                                <h4 id="interest">₹0</h4>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="result-card">
                                <p>Total Payment</p>
                                <h4 id="totalPayment">₹0</h4>
                            </div>
                        </div>

                    </div>

                    <p class="small text-secondary mt-3 mb-0">
                        Calculation is an estimate. Actual lender charges may differ.
                    </p>

                </div>

            </div>

        </div>

    </div>

</main>

<footer class="footer">
    Made with ❤️ by SabkaMitra
</footer>

<script>
const amountInput = document.getElementById("loanAmount");
const rateInput = document.getElementById("interestRate");
const yearsInput = document.getElementById("loanYears");
const monthsInput = document.getElementById("loanMonths");
const error = document.getElementById("error");

function formatRupees(value) {
    return "₹" + value.toLocaleString("en-IN", {
        maximumFractionDigits: 2,
        minimumFractionDigits: 2
    });
}

function calculateEMI() {

    error.textContent = "";

    const principal = Number(amountInput.value);
    const annualRate = Number(rateInput.value);
    const years = Number(yearsInput.value || 0);
    const extraMonths = Number(monthsInput.value || 0);

    if (!amountInput.value || principal <= 0 ||
        !rateInput.value || annualRate < 0 ||
        years < 0 || extraMonths < 0 ||
        extraMonths > 11 || !Number.isFinite(principal + annualRate + years + extraMonths)) {

        error.textContent = "Please enter valid loan details.";
        return;
    }

    const totalMonths = years * 12 + extraMonths;

    if (!Number.isInteger(totalMonths) || totalMonths <= 0) {
        error.textContent = "Loan duration must be at least 1 month.";
        return;
    }

    const monthlyRate = annualRate / 12 / 100;

    let emi;

    if (monthlyRate === 0) {
        emi = principal / totalMonths;
    } else {
        const factor = Math.pow(1 + monthlyRate, totalMonths);
        emi = principal * monthlyRate * factor / (factor - 1);
    }

    const totalPayment = emi * totalMonths;
    const totalInterest = totalPayment - principal;

    document.getElementById("emi").textContent =
        formatRupees(emi);

    document.getElementById("principal").textContent =
        formatRupees(principal);

    document.getElementById("interest").textContent =
        formatRupees(totalInterest);

    document.getElementById("totalPayment").textContent =
        formatRupees(totalPayment);
}

document.getElementById("calculateBtn")
.addEventListener("click", calculateEMI);

document.getElementById("resetBtn")
.addEventListener("click", function() {

    amountInput.value = "";
    rateInput.value = "";
    yearsInput.value = "";
    monthsInput.value = "";

    error.textContent = "";

    document.getElementById("emi").textContent = "₹0";
    document.getElementById("principal").textContent = "₹0";
    document.getElementById("interest").textContent = "₹0";
    document.getElementById("totalPayment").textContent = "₹0";

});
</script>

</body>
</html>
